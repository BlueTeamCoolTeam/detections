title: Certutil Decode To Script File In Windows Temp
id: 6f0c2a55-8f0e-4b8a-9d8e-2b1f3c7a9e41
status: experimental
description: certutil decoding a Base64 file into a script in C:\Windows\Temp, as used to stage the Agta VBS via ScreenConnect
references:
    - https://blueteam.cool/posts/agta-strikes-again/
author: blueteam.cool
date: 2026-09-26
tags:
    - attack.defense-evasion
    - attack.t1140
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\certutil.exe'
        CommandLine|contains: '-decode'
    script_out:
        CommandLine|contains:
            - '.vbs'
            - '.vbe'
            - '.js'
            - '.ps1'
    condition: selection and script_out
falsepositives:
    - Rare administrative scripting; check the parent (a remote-support service parent is a strong signal)
level: high
