title: Agta Backup Agent - IFEO Debugger Redirect on SlideToShutDown.exe
id: 3e5a7c9b-0d2f-4e4a-b1c2-3d4e5f6a7b8c
status: experimental
description: Detects the "Disable power options" operator quick-command's Image File Execution Options abuse -- it sets a Debugger value on SlideToShutDown.exe so Windows' own slide-to-shut-down gesture launches systray.exe instead of shutting the machine down. This is a registry-based sub-technique of the same victim-lockout tooling in sigma-agta-hidden-service.yml.
references:
  - https://blueteam.cool/posts/fake-webex-multi-rmm/
author: Luke Wilkinson
date: 2026-09-05
tags:
  - attack.defense_evasion
  - attack.t1112
  - attack.privilege_escalation
  - attack.t1546.012
logsource:
  product: windows
  category: registry_event
  definition: Requires registry-modification logging (Sysmon Event ID 13)
detection:
  selection:
    TargetObject|contains: 'Image File Execution Options\SlideToShutDown.exe'
    TargetObject|endswith: '\Debugger'
  condition: selection
falsepositives:
  - None known -- SlideToShutDown.exe has no legitimate reason to carry an IFEO debugger redirect
level: high
